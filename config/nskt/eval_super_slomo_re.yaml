data_name: nskt
model: SuperSloMo
# Must match a checkpoint trained with FLEX-style log-Re Fourier FiLM.
condition_on_re: true
reynolds_normalization_scale: 40000.0
re_id: 0
batch_size: 64
patch_size: 256
stride: 32
epochs: 200
learning_rate: 6.0e-5
total_interp_steps: 20
total_interp_steps_train: 20
is_T_fixed: true
scratch_dir: data/nskt/
checkpoint_path: checkpoints/nskt/super_slomo_re_best.pt
