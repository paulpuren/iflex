# SuperSloMo conditioned like FLEX: Fourier features of log(Re) and bottleneck FiLM.
run_name: SuperSloMo_Re
data_name: nskt
model: SuperSloMo
condition_on_re: true
reynolds_normalization_scale: 40000.0
sampling_freq: 5
