# Continue training FLEX on NSKT for 100 more epochs.
# If the base run finished at epoch 300, set epochs=400 here because train.py
# interprets `epochs` as the final target epoch, not the number of extra epochs.
#
# Launch with:
#   python train.py --config config/nskt/flex_posttrain.yaml
#
# If your checkpoint filename differs, update `checkpoint_path` below.
run_name: FLEX_posttrain
data_name: nskt
model: FLEX
flex_model_size: small
flex_mlp_ratio: 2
use_scalar_film: true
use_spatial_cond: true
spatial_cond_scales: [32, 16]
spatial_cond_mode: gated
ddp_find_unused_parameters: true
sampling_freq: 10
validation_freq: 5
optimizer: adam
epochs: 300 # 150 # 300
batch_size: 12
learning_rate: 1.0e-4
checkpoint_path: checkpoints/nskt/flex3_best.pt

resume_training: true
total_interp_steps_train: 20
is_T_fixed: False # True # false
patch_size: 256
stride: 32
scratch_dir: data/nskt/
prediction_type: v
sampler: ddim
time_steps: 3
base_width: 128
