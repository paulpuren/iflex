# Continue training FLEXResidual on NSKT for posttraining.
# If the base run finished at epoch 300, set epochs to the final target epoch
# because train.py interprets `epochs` as the final epoch, not extra epochs.
#
# Launch with:
#   python train.py --config config/ablation/flex_residual_nskt_posttrain.yaml
#
# If your checkpoint filename differs, update `checkpoint_path` below.
run_name: FLEX_residual_nskt_posttrain_zero
data_name: nskt
model: FLEXResidualZero
flex_model_size: small
flex_mlp_ratio: 2
use_scalar_film: true
use_spatial_cond: true
spatial_cond_scales: [32, 16]
spatial_cond_mode: gated
ddp_find_unused_parameters: true
sampling_freq: 10
validation_freq: 5
optimizer: adam
epochs: 300 # 300
batch_size: 12
learning_rate: 1.0e-4
checkpoint_path: checkpoints/nskt/flexresidualzero_last.pt
resume_training: true
total_interp_steps_train: 20
is_T_fixed: false
patch_size: 256
stride: 32
scratch_dir: data/nskt/
prediction_type: v
sampler: ddim
time_steps: 3
base_width: 128
