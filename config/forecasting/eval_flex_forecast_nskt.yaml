# Autoregressive NSKT forecasting evaluation for FLEXForecast.
data_name: forecasting_nskt
model: FLEXForecast
flex_model_size: small
flex_mlp_ratio: 2
use_scalar_film: true
use_spatial_cond: true
spatial_cond_scales: [32, 16]
spatial_cond_mode: gated
reynolds_normalization_scale: 40000.0
forecast_baseline: persistence
optimizer: adam
epochs: 100 #300 # 500
learning_rate: 1.0e-4
batch_size: 12
patch_size: 256
stride: 32
scratch_dir: data/nskt/
prediction_type: v
sampler: ddim
time_steps: 3
total_interp_steps_train: 1
forecast_train_horizon: 1
forecast_conditioning_mode: forecast
forecast_horizon: 20
re_id: -1
checkpoint_path: checkpoints/forecasting_nskt/flexforecast_renorm40000_best.pt
