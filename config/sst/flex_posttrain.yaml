# Post-trained SST FLEX configuration.
# Set checkpoint_path to a compatible SST checkpoint before continuing training.
#
# Launch with:
#   python train.py --config config/sst/flex_posttrain.yaml
run_name: FLEX_posttrain
data_name: sea_temp
model: FLEX
flex_model_size: small
flex_mlp_ratio: 2
use_scalar_film: true
use_spatial_cond: true
spatial_cond_scales: [32, 16]
spatial_cond_mode: gated
ddp_find_unused_parameters: true
sampling_freq: 5
validation_freq: 5
optimizer: adam
epochs: 100
batch_size: 32
learning_rate: 1.0e-4
checkpoint_path: checkpoints/sst/flex_last.pt
resume_training: true
total_interp_steps_train: 10
is_T_fixed: false
patch_size: 128
stride: 32
scratch_dir: data/sst/
prediction_type: v
sampler: ddim
time_steps: 3
base_width: 128
